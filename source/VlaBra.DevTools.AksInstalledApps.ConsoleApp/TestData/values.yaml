alarminsight-argo:
  enabled: true
  application:
    chartname: eventbroker
    autodeploy: false

eventbroker:
  # keycloak:
  #   host: insight.abb.com
  image:
    repository: "paenglobal.azurecr.io/alarminsight/event-broker-3"
    tag: "3.1.1.33"
  ingress:
    enabled: false
  global:
    oidc:
      host: energy.ability.abb

  settings:
    appSettingsJson:
      locations:
        #DEMO ****************************************************************************************
        - name: adnoc
          type: sql
          connection:
            connectionString: "Server=tcp:coc-eu-production-sqlserver.database.windows.net,1433;Initial Catalog=EventBroker-adnoc;Persist Security Info=False;User ID=eventbrokeradnocuser;Password=9832#IRJ2083RawE;MultipleActiveResultSets=False;Encrypt=True;TrustServerCertificate=True;Connection Timeout=240;"
            user: "eventbrokeradnocuser"
            password: "9832#IRJ2083RawE"
          events:
            use: true
            view: dbo.BaseEvents
          alarms:
            use: true
            view: dbo.BaseEvents
            alarmPriorities: 1,2,3,4
            defaultFilter: false
          filters:
            - name: operatorAlarmList
              eventCategory: 2888472444,1429859357,2632118662,626678824,666371,792944717,345733597
            - name: standingAlarms
              rawQuery: newState:(1 OR 3 OR 5)
            - name: processEvents
              eventCategoryType: 0
          severityRanges:
            - priority: 1
              from: 901
              to: 1000
              isAlarm: true
            - priority: 2
              from: 801
              to: 900
              isAlarm: true
            - priority: 3
              from: 701
              to: 800
              isAlarm: true
            - priority: 4
              from: 0
              to: 700
              isAlarm: false
